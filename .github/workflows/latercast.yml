name: Add LaterCast Episode

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili / YouTube / other supported video URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  latercast:
    uses: gutingguting/gutingguting.github.io/.github/workflows/latercast-runner.yml@latercast
    with:
      url: ${{ inputs.url }}
