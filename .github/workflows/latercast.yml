name: Add LaterCast Episode

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Bilibili / YouTube / other supported video URL"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: latercast
  cancel-in-progress: false

jobs:
  add-episode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install yt-dlp pillow

      - name: Build podcast episode
        env:
          LATERCAST_SITE_URL: https://gutingguting.github.io
        run: |
          python scripts/latercast.py "${{ inputs.url }}"

      - name: Read LaterCast result
        id: result
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d = json.loads(Path('work/latercast-result.json').read_text(encoding='utf-8'))
          for key in ('tag', 'asset_path', 'asset_name', 'title', 'feed_url'):
              value = str(d[key]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'{key}={value}')
          PY

      - name: Create or update GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.result.outputs.tag }}
          ASSET_PATH: ${{ steps.result.outputs.asset_path }}
          TITLE: ${{ steps.result.outputs.title }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$TAG" "$ASSET_PATH" \
              --title "$TITLE" \
              --notes "LaterCast episode generated from a user-supplied video URL."
          fi

      - name: Commit RSS metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/podcast/ scripts/latercast.py
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "podcast: add LaterCast episode"
            git push
          fi

      - name: Summary
        run: |
          echo "### LaterCast complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Episode: ${{ steps.result.outputs.title }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Feed: ${{ steps.result.outputs.feed_url }}" >> "$GITHUB_STEP_SUMMARY"

  build-pages:
    runs-on: ubuntu-latest
    needs: add-episode
    steps:
      - name: Checkout updated repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Build and upload Pages artifact
        uses: withastro/action@v6

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
