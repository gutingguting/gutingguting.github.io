name: LaterCast Runner

on:
  workflow_call:
    inputs:
      url:
        description: "Video URL to convert into a podcast episode"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: latercast
  cancel-in-progress: false

jobs:
  download:
    # The video download runs on the user's own machine/network instead of an
    # Azure/GitHub-hosted IP. Add a repository self-hosted runner with the
    # custom label `latercast` once, then this job is routed there.
    runs-on: [self-hosted, latercast]

    # If the runner itself reaches GitHub through an HTTP(S) proxy, allow
    # Bilibili traffic to bypass that proxy. A full-tunnel VPN still needs
    # split tunneling in the VPN client.
    env:
      NO_PROXY: bilibili.com,.bilibili.com,b23.tv
      no_proxy: bilibili.com,.bilibili.com,b23.tv

    steps:
      - name: Checkout LaterCast branch
        uses: actions/checkout@v7
        with:
          ref: latercast

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: >-
          python -m pip install --upgrade pip
          "yt-dlp[default,curl-cffi] @ https://github.com/thanhtaivtt/yt-dlp/archive/c46ead3168dd1f56cdba9b1b2baa44b0e2bc3e31.zip"
          pillow

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Show downloader version
        run: |
          yt-dlp --version
          yt-dlp --list-impersonate-targets

      - name: Build podcast episode locally
        env:
          LATERCAST_BRANCH: latercast
          LATERCAST_SITE_URL: https://raw.githubusercontent.com/gutingguting/gutingguting.github.io/latercast/public
          LATERCAST_HOME_URL: https://github.com/gutingguting/gutingguting.github.io/tree/latercast
        run: python scripts/latercast.py "${{ inputs.url }}"

      - name: Upload prepared episode to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: latercast-prepared
          path: |
            work/*.m4a
            work/latercast-result.json
            public/podcast/
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary local audio
        if: always()
        run: python -c "import shutil; shutil.rmtree('work', ignore_errors=True)"

  publish:
    # Everything after the actual Bilibili download stays in GitHub's cloud:
    # Release asset upload, RSS metadata commit, and feed management.
    runs-on: ubuntu-latest
    needs: download

    steps:
      - name: Checkout LaterCast branch
        uses: actions/checkout@v7
        with:
          ref: latercast

      - name: Download prepared episode
        uses: actions/download-artifact@v4
        with:
          name: latercast-prepared
          path: .

      - name: Read LaterCast result
        id: result
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d = json.loads(Path('work/latercast-result.json').read_text(encoding='utf-8'))
          for key in ('tag', 'asset_path', 'asset_name', 'title', 'feed_url'):
              value = str(d[key]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'{key}={value}')
          PY

      - name: Create or update GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.result.outputs.tag }}
          ASSET_PATH: ${{ steps.result.outputs.asset_path }}
          TITLE: ${{ steps.result.outputs.title }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$TAG" "$ASSET_PATH" \
              --title "$TITLE" \
              --notes "LaterCast episode generated from a user-supplied video URL."
          fi

      - name: Commit feed metadata to LaterCast branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/podcast/
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "podcast: add LaterCast episode"
            git push origin HEAD:latercast
          fi

      - name: Summary
        run: |
          echo "### LaterCast complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Episode: ${{ steps.result.outputs.title }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Feed: ${{ steps.result.outputs.feed_url }}" >> "$GITHUB_STEP_SUMMARY"
